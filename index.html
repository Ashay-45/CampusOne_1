<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CampusOne — Intelligent Academic & Career Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CampusOne connects academics, skill mastery, dynamic attendance, assessments, AI mentorship and career development in one polished, unified platform.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #EDF0EA;
  --sf: rgba(255, 255, 255, 0.76);
  --ink: #14201C;
  --mut: #5C6B65;
  --bd: rgba(20, 32, 28, 0.12);
  --ac: #1F7A6B;
  --hi: #E8A317;
  --bad: #C2410C;
  --ok: #1F7A6B;
  --sh: 0 1px 2px rgba(20, 32, 28, 0.06), 0 8px 24px -12px rgba(20, 32, 28, 0.18);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1614;
    --sf: rgba(30, 42, 38, 0.72);
    --ink: #E6EEE9;
    --mut: #97A8A0;
    --bd: rgba(230, 238, 233, 0.12);
    --ac: #4CC2AB;
    --hi: #F2B93B;
    --bad: #F08A57;
    --sh: 0 8px 24px -12px rgba(0, 0, 0, 0.6);
  }
}

:root[data-theme="dark"] {
  --bg: #0F1614;
  --sf: rgba(30, 42, 38, 0.72);
  --ink: #E6EEE9;
  --mut: #97A8A0;
  --bd: rgba(230, 238, 233, 0.12);
  --ac: #4CC2AB;
  --hi: #F2B93B;
  --bad: #F08A57;
  --sh: 0 8px 24px -12px rgba(0, 0, 0, 0.6);
}

:root[data-theme="light"] {
  --bg: #EDF0EA;
  --sf: rgba(255, 255, 255, 0.76);
  --ink: #14201C;
  --mut: #5C6B65;
  --bd: rgba(20, 32, 28, 0.12);
  --ac: #1F7A6B;
  --hi: #E8A317;
  --bad: #C2410C;
  --sh: 0 1px 2px rgba(20, 32, 28, 0.06), 0 8px 24px -12px rgba(20, 32, 28, 0.18);
}

* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 'Instrument Sans', system-ui, -apple-system, sans-serif;
  transition: background 0.25s, color 0.25s;
  overflow-x: hidden;
  background: radial-gradient(800px 480px at 8% -8%, rgba(31,122,107,0.2), transparent 70%),
              radial-gradient(640px 460px at 100% 0, rgba(232,163,23,0.16), transparent 70%),
              var(--bg);
  background-attachment: fixed;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image: linear-gradient(var(--bd) 1px, transparent 1px),
                    linear-gradient(90deg, var(--bd) 1px, transparent 1px);
  background-size: 44px 44px;
  opacity: 0.35;
  -webkit-mask-image: radial-gradient(ellipse at 50% 0, #000, transparent 72%);
  mask-image: radial-gradient(ellipse at 50% 0, #000, transparent 72%);
}

h1, h2, h3, h4 {
  font-family: 'Bricolage Grotesque', Georgia, serif;
  margin: 0;
  letter-spacing: -0.015em;
  font-weight: 700;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }

/* Sticky Top Navigation */
.top {
  position: sticky;
  top: calc(10px + env(safe-area-inset-top, 0px));
  z-index: 25;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  margin: 10px auto 0;
  max-width: 1200px;
  width: calc(100% - 24px);
  background: var(--sf);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--bd);
  border-radius: 999px;
  box-shadow: var(--sh);
}

.logo {
  font: 800 21px 'Bricolage Grotesque', serif;
  margin-right: 12px;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition: transform 0.2s;
}
.logo:hover { transform: scale(1.05) rotate(-1deg); }
.logo i { font-style: normal; color: var(--hi); }

nav {
  display: flex;
  gap: 3px;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }

nav a, .mb {
  padding: 7px 13px;
  border-radius: 999px;
  color: var(--mut);
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
  border: 0;
  background: none;
  font-weight: 500;
  font-size: 14px;
  transition: background 0.15s, color 0.15s, transform 0.15s;
}
nav a:hover, .mb:hover { background: var(--bd); color: var(--ink); }
nav a.on {
  background: var(--ac);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 4px 14px -4px var(--ac);
}

.ib {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--bd);
  background: var(--sf);
  cursor: pointer;
  position: relative;
  display: grid;
  place-items: center;
  transition: transform 0.15s, background 0.15s;
  flex-shrink: 0;
}
.ib:hover { transform: translateY(-1px); background: var(--bd); }
.dot {
  position: absolute;
  top: 7px;
  right: 8px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--hi);
}

.menu {
  position: fixed;
  right: 16px;
  top: calc(66px + env(safe-area-inset-top, 0px));
  z-index: 30;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 16px;
  box-shadow: 0 16px 40px -12px rgba(0,0,0,0.35);
  padding: 6px;
  animation: pop 0.16s cubic-bezier(0.2, 0.9, 0.3, 1.1);
  backdrop-filter: blur(16px);
}
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(0.96); } }
.menu a {
  display: block;
  padding: 9px 14px;
  border-radius: 10px;
  color: var(--ink);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
}
.menu a:hover { background: var(--bd); }

/* Main layout */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 16px 64px;
  animation: fade 0.25s ease-out;
}
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.grid {
  display: grid;
  gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
}
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }

/* Card design with cursor illumination */
.card {
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--sh);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  min-width: 0;
  position: relative;
  overflow: hidden;
  transition: border-color 0.25s, transform 0.2s, box-shadow 0.2s;
}
.card:hover {
  border-color: color-mix(in srgb, var(--ac) 45%, var(--bd));
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  background: radial-gradient(280px circle at var(--mx, 50%) var(--my, 50%), rgba(232, 163, 23, 0.16), transparent 70%);
}
.card:hover::before { opacity: 1; }

.grid > .card {
  animation: up 0.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.grid > .card:nth-child(2) { animation-delay: 0.04s; }
.grid > .card:nth-child(3) { animation-delay: 0.08s; }
.grid > .card:nth-child(4) { animation-delay: 0.12s; }
.grid > .card:nth-child(5) { animation-delay: 0.16s; }
.grid > .card:nth-child(6) { animation-delay: 0.20s; }
.grid > .card:nth-child(7) { animation-delay: 0.24s; }
.grid > .card:nth-child(8) { animation-delay: 0.28s; }

/* KPI Cards */
.kpi { transition: transform 0.2s, box-shadow 0.2s; }
.kpi:hover { transform: translateY(-3px); }
.kpi::after {
  content: '';
  position: absolute;
  left: 20px;
  top: 0;
  width: 36px;
  height: 3px;
  border-radius: 0 0 4px 4px;
  background: var(--hi);
}
.kpi b {
  display: block;
  font: 800 32px/1.15 'Bricolage Grotesque', serif;
  margin: 6px 0;
  letter-spacing: -0.02em;
}
.kpi span, .mut { color: var(--mut); font-size: 13px; }

/* Hero */
.hero { margin-bottom: 20px; }
.hero h1 { font-size: clamp(28px, 4.5vw, 46px); line-height: 1.08; }
.hero p { margin-top: 4px; }
.gt {
  background: linear-gradient(90deg, var(--ac), var(--hi));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* Buttons */
.btn {
  padding: 9px 16px;
  border-radius: 10px;
  border: 1px solid var(--bd);
  background: var(--sf);
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: transform 0.15s, background 0.15s, opacity 0.15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn:hover { transform: translateY(-1px); background: var(--bd); }
.btn:active { transform: scale(0.97); }
.btn.p {
  background: linear-gradient(135deg, var(--ac), color-mix(in srgb, var(--ac) 75%, #000));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 6px 16px -6px var(--ac);
}
.btn.p:hover { filter: brightness(1.06); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }

/* Progress bar */
.bar {
  height: 9px;
  border-radius: 9px;
  background: var(--bd);
  overflow: hidden;
  margin: 6px 0;
}
.bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--ac), color-mix(in srgb, var(--ac) 60%, var(--hi)));
  border-radius: 9px;
  transition: width 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.bar i.w { background: var(--bad); }
.bar i.h { background: var(--hi); }

.row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

/* Status & Tags */
.tag {
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--bd);
  background: rgba(0,0,0,0.02);
  display: inline-block;
}
.tag.a { background: var(--hi); color: #14201C; border-color: transparent; font-weight: 700; }
.st {
  padding: 3px 11px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  display: inline-block;
}
.st.safe { background: rgba(31, 122, 107, 0.16); color: var(--ok); }
.st.def { background: rgba(194, 65, 12, 0.16); color: var(--bad); }
.st.pv { background: rgba(232, 163, 23, 0.2); color: var(--hi); }

.alert {
  border-left: 4px solid var(--bad);
  background: rgba(194, 65, 12, 0.09);
  border-radius: 14px;
  padding: 12px 16px;
  animation: up 0.35s both;
}
.alert.safe {
  border-left-color: var(--ok);
  background: rgba(31, 122, 107, 0.09);
}

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  padding: 6px 13px;
  border-radius: 99px;
  border: 1px solid var(--bd);
  background: none;
  cursor: pointer;
  font-size: 13px;
  transition: background 0.15s, color 0.15s, transform 0.15s;
}
.chip:hover { transform: translateY(-1px); background: var(--bd); }
.chip.on { background: var(--ac); color: #fff; border-color: transparent; font-weight: 600; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.tabs button {
  padding: 7px 15px;
  border-radius: 99px;
  border: 1px solid var(--bd);
  background: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s;
}
.tabs button:hover { background: var(--bd); }
.tabs button.on { background: var(--ink); color: var(--bg); font-weight: 600; border-color: transparent; }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
td, th {
  padding: 10px 10px;
  text-align: left;
  border-bottom: 1px solid var(--bd);
  white-space: nowrap;
}
th { color: var(--mut); font-weight: 600; font-size: 13px; }

input, select, textarea {
  width: 100%;
  padding: 10px 13px;
  border-radius: 11px;
  border: 1px solid var(--bd);
  background: var(--bg);
  box-sizing: border-box;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--ac);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 20%, transparent);
}
label { display: block; font-size: 13px; color: var(--mut); margin: 12px 0 4px; font-weight: 500; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 4px; }
.okm { color: var(--ok); }
.empty { text-align: center; padding: 32px 16px; color: var(--mut); }

/* Login screen */
.login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.side {
  padding: 48px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background: var(--ink);
  color: var(--bg);
  position: relative;
  overflow: hidden;
}
.side h1 { font-size: clamp(32px, 4.4vw, 54px); line-height: 1.05; max-width: 480px; }
.side p { max-width: 440px; opacity: 0.8; font-size: 16px; }
.side svg { position: absolute; top: 36px; right: -30px; opacity: 0.85; animation: spin 90s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.fl {
  position: absolute;
  padding: 12px 18px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  animation: flt 6s ease-in-out infinite;
  font-size: 13px;
}
.fl b { display: block; font: 700 22px 'Bricolage Grotesque', serif; margin-top: 2px; }
.f1 { top: 110px; right: 48px; }
.f2 { top: 230px; right: 140px; animation-delay: -3s; }
@keyframes flt { 50% { transform: translateY(-10px); } }

.form { padding: 48px 24px; display: flex; align-items: center; justify-content: center; }
.form > div { width: 100%; max-width: 400px; animation: up 0.5s 0.1s both; }

/* Assessments & options */
.opt {
  display: block;
  padding: 12px 15px;
  border: 1px solid var(--bd);
  border-radius: 12px;
  margin: 8px 0;
  cursor: pointer;
  color: var(--ink);
  background: none;
  width: 100%;
  text-align: left;
  transition: all 0.15s;
}
.opt:hover { transform: translateX(4px); border-color: var(--ac); }
.opt.s { border-color: var(--ac); background: color-mix(in srgb, var(--ac) 15%, transparent); font-weight: 600; }
.opt.c { border-color: var(--ok); background: rgba(31, 122, 107, 0.2); }
.opt.x { border-color: var(--bad); background: rgba(194, 65, 12, 0.15); }

/* Chat bubbles */
.chat { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; margin: 12px 0; }
.m {
  padding: 10px 14px;
  border-radius: 16px;
  max-width: 85%;
  line-height: 1.45;
  animation: up 0.25s both;
  word-break: break-word;
}
.m.u { align-self: flex-end; background: var(--ac); color: #fff; border-bottom-right-radius: 4px; }
.m.b { align-self: flex-start; background: var(--bd); border-bottom-left-radius: 4px; }
.m.wide { max-width: 100%; width: 100%; }
.m .ts { font-size: 11px; opacity: 0.65; margin-top: 4px; }
.m.u .ts { text-align: right; color: rgba(255,255,255,0.85); }

.typing { display: flex; gap: 5px; padding: 12px 16px; }
.typing i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--mut);
  animation: dot 1s infinite;
}
.typing i:nth-child(2) { animation-delay: 0.15s; }
.typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes dot {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
  40% { transform: translateY(-6px); opacity: 1; }
}

/* Modals */
.ov {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(10, 18, 15, 0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: grid;
  place-items: center;
  padding: 16px;
  animation: fade 0.2s;
  transition: opacity 0.18s;
}
.ov.out { opacity: 0; }
.ov.out .modal { transform: scale(0.96) translateY(8px); }
.modal {
  width: 100%;
  max-width: 580px;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.5);
  animation: mp 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.15);
  transition: transform 0.18s;
}
@keyframes mp { from { opacity: 0; transform: scale(0.94) translateY(16px); } }

.toast {
  position: fixed;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: 99px;
  z-index: 60;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  font-weight: 500;
  font-size: 14px;
  animation: ti 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.1);
}
@keyframes ti { from { opacity: 0; transform: translate(-50%, 14px); } }

/* Floating AI Bubble & Panel */
.bub {
  position: fixed;
  right: 20px;
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: 0;
  cursor: pointer;
  z-index: 35;
  color: #fff;
  font-size: 24px;
  background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--ac) 55%, #fff), var(--ac) 60%);
  box-shadow: 0 12px 30px -8px var(--ac), inset 0 2px 6px rgba(255, 255, 255, 0.5);
  animation: bob 4s ease-in-out infinite;
  transition: transform 0.2s;
  display: grid;
  place-items: center;
}
.bub::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid var(--ac);
  animation: pulse 2.4s ease-out infinite;
  pointer-events: none;
}
.bub:hover { transform: scale(1.1); }
@keyframes bob { 50% { transform: translateY(-8px); } }
@keyframes pulse { from { transform: scale(1); opacity: 0.7; } to { transform: scale(1.65); opacity: 0; } }

.bpanel {
  position: fixed;
  right: 20px;
  bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  width: min(390px, calc(100vw - 32px));
  max-height: calc(100vh - 120px);
  z-index: 36;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 16px;
  box-shadow: 0 24px 60px -16px rgba(0, 0, 0, 0.45);
  animation: mp 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.15);
  transform-origin: bottom right;
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.bpanel .chat {
  max-height: 280px;
  min-height: 160px;
  overflow-y: auto;
  scroll-behavior: smooth;
  margin: 10px 0;
}
.bpanel .inrow {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  margin-top: 8px;
}
.bpanel .inrow textarea, #ci2 {
  flex: 1;
  resize: none;
  min-height: 44px;
  max-height: 120px;
  font-size: 15px;
  line-height: 1.4;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--bd);
  background: var(--sf);
  color: var(--ink);
  pointer-events: auto !important;
  user-select: text !important;
  -webkit-user-select: text !important;
  cursor: text !important;
}

/* Full page chat styles */
.aichat .chat {
  max-height: 56vh;
  min-height: 260px;
  overflow-y: auto;
  scroll-behavior: smooth;
  margin: 0;
}
.inrow { display: flex; gap: 8px; align-items: flex-end; margin-top: 12px; }
.sgrow { flex-wrap: nowrap; overflow-x: auto; margin: 10px 0 0; scrollbar-width: none; }
.sgrow button { white-space: nowrap; }

/* Resume Paper ATS layout */
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.paper {
  background: #fff;
  color: #111;
  font: 13px/1.45 Arial, Helvetica, sans-serif;
  padding: 30px;
  border-radius: 12px;
  overflow-wrap: anywhere;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

// Convert Base64 data URL to Blob
function dataURLtoBlob(dataurl) {
  const arr = dataurl.split(',');
  const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--) u8arr[n] = bstr.charCodeAt(n);
  return new Blob([u8arr], { type: mime });
}

// Password hashing
async function hashPassword(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));

}

    case 'Fill in the Blank':

    case 'Short Answer':

    case 'Case Study':

// Attendance helpers
function attOf(id) {
  if (!S.att[id]) {
    const s = SEEDS.find(x => x[4] === id);
    S.att[id] = Object.fromEntries(SUBJ.map((k, i) => [k, [TOT[i], s ? s[3][i] : DEFA[i]]]));
  }
  return S.att[id];
}
function attRow(id, k) {
  const o = attOf(id);
  if (!o[k]) o[k] = [30, 25];
  return o[k];
}
const pc = r => (r && r[0] > 0) ? Math.round(r[1] / r[0] * 100) : 0;
const isDefaulter = r => (r && r[0] > 0) ? (r[1] / r[0] < 0.75) : false;
const stb = r => `<span class="st ${isDefaulter(r) ? 'def' : 'safe'}">${isDefaulter(r) ? 'DEFAULTER' : 'SAFE'}</span>`;

function ovr(id) {
  const v = Object.values(attOf(id)).filter(r => r[0] > 0);
  const T = v.reduce((s, r) => s + r[0], 0);
  return T ? Math.round(v.reduce((s, r) => s + r[1], 0) / T * 100) : 0;
}

// Dynamic Attendance data for logged in student
function attData() {
  const myId = user ? user.email : 'aarav@campus.edu';
  const rows = Object.entries(attOf(myId)).map(([k, [t, a]]) => ({
    k, t, a, m: Math.max(0, t - a),
    p: Math.round(a / t * 100),
    def: a / t < 0.75
  }));
  const T = rows.reduce((s, r) => s + r.t, 0);
  const A = rows.reduce((s, r) => s + r.a, 0);
  const p = T ? Math.round(A / T * 100) : 0;
  return {
    rows, T, A, M: Math.max(0, T - A), p,
    def: p < 75,
    defs: rows.filter(r => r.def)
  };
}

function lineChart(v) {
  const w = 520, h = 190, p = 28, mn = 7.5, mx = 8.6;
  const x = i => p + i * (w - 2 * p) / (v.length - 1);
  const y = n => h - p - (n - mn) / (mx - mn) * (h - 2 * p);
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="SGPA Trend">
      <path d="${v.map((n, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(n)).join('')}" fill="none" stroke="var(--ac)" stroke-width="3"/>
      ${v.map((n, i) => `

}

/* =========================================================================
   ASSESSMENTS ENGINE & TEST RUNNER
   ========================================================================= */
let activeAssessment = null;

function gradeAnswer(q, a) {
  const T = q[3], c = q[6];
  if (a == null || a === '' || (Array.isArray(a) && !a.length)) return 0;
  if (T === 'Multiple Correct') return JSON.stringify([...a].sort()) === JSON.stringify(c) ? 1 : 0;
  if (T === 'Fill in the Blank') return c.includes(String(a).trim().toLowerCase()) ? 1 : 0;
  if (T === 'Short Answer') {
    const t = String(a).toLowerCase();
    return c.filter(k => t.includes(k)).length >= Math.ceil(c.length / 2) ? 1 : 0;
  }
  return a === c ? 1 : 0;
}

function startTestRunner(test) {
  const qs = test.qs && test.qs.length ? test.qs : buildQs({ course: test.course || 'DSA', n: 5 });
  activeAssessment = {
    test,
    qs,
    i: 0,
    a: {},
    r: new Set(),
    t0: Date.now(),
    left: (test.time || 10) * 60,
    saved: false
  };
  renderActiveAssessment();
}

function renderActiveAssessment() {
  const a = activeAssessment;
  if (!a) return;
  const q = a.qs[a.i];
  const T = q[3];
  const v = a.a[a.i];
  const pg = $('#pg');

  let body = '';
  if (T === 'Multiple Correct') {
    body = '<p class="mut">Select all options that apply:</p>' + q[5].map((o, i) => `
      <button class="opt ${(v || []).includes(i) ? 's' : ''}" data-m="${i}">${esc(o)}</button>
    `).join('');
  } else if (q[5]) {
    body = q[5].map((o, i) => `
      <button class="opt ${v === i ? 's' : ''}" data-o="${i}">${esc(o)}</button>
    `).join('');
  } else {
    body = `<textarea id="tx" rows="${T === 'Short Answer' ? 3 : 1}" placeholder="Type your answer here...">${esc(v || '')}</textarea>`;
  }

  pg.innerHTML = `
    <div class="card" style="max-width:840px;margin:0 auto">
      <div class="row">
        <b>Question ${a.i + 1} of ${a.qs.length}</b>
        <span class="tag a" id="tm-left"></span>
      </div>
      ${bar((a.i + 1) / a.qs.length * 100)}
      <div style="margin:8px 0">
        <span class="tag">${esc(q[0])} · ${esc(q[1])} · ${esc(q[2])} · ${esc(T)} · ${q[8]} marks</span>
      </div>
      <h3 style="margin:16px 0">${esc(q[4])}</h3>
      ${body}
      <div class="row" style="margin-top:20px">
        <button class="btn" id="pv" ${a.i ? '' : 'disabled'}>Previous</button>
        <button class="btn" id="mr">${a.r.has(a.i) ? 'Unmark Review' : 'Mark for Review'}</button>
        ${a.i < a.qs.length - 1
          ? '<button class="btn p" id="nx">Next Question</button>'
          : '<button class="btn p" id="su">Submit Assessment</button>'
        }
      </div>
    </div>
  `;

  // Timer
  const tick = () => {
    const el = $('#tm-left');
    if (!el) return clearInterval(a.iv);
    const remaining = a.left - Math.floor((Date.now() - a.t0) / 1000);
    if (remaining <= 0) {
      clearInterval(a.iv);
      finishAssessment();
      return;
    }
    el.textContent = `${Math.floor(remaining / 60)}:${String(remaining % 60).padStart(2, '0')} remaining`;
  };
  clearInterval(a.iv);
  tick();
  a.iv = setInterval(tick, 1000);

  // Bind answer selection
  $$('[data-o]').forEach(b => b.onclick = () => {
    a.a[a.i] = +b.dataset.o;
    renderActiveAssessment();
  });
  $$('[data-m]').forEach(b => b.onclick = () => {
    const s = new Set(a.a[a.i] || []);
    const idx = +b.dataset.m;
    s.has(idx) ? s.delete(idx) : s.add(idx);
    a.a[a.i] = [...s];
    renderActiveAssessment();
  });
  const tx = $('#tx');
  if (tx) tx.oninput = () => { a.a[a.i] = tx.value; };

  $('#pv').onclick = () => { a.i--; renderActiveAssessment(); };
  $('#mr').onclick = () => {
    a.r.has(a.i) ? a.r.delete(a.i) : a.r.add(a.i);
    renderActiveAssessment();
  };
  const nx = $('#nx');
  if (nx) nx.onclick = () => { a.i++; renderActiveAssessment(); };
  const su = $('#su');
  if (su) su.onclick = finishAssessment;
}

function finishAssessment() {
  const a = activeAssessment;
  if (!a) return;
  clearInterval(a.iv);

  let ok = 0, score = 0, total = 0;
  const topicStats = {};

  a.qs.forEach((q, idx) => {
    total += q[8];
    const isCorrect = gradeAnswer(q, a.a[idx]);
    if (isCorrect) {
      ok++;
      score += q[8];
    }
    const tp = q[1];
    topicStats[tp] = topicStats[tp] || [0, 0];
    topicStats[tp][1]++;
    if (isCorrect) topicStats[tp][0]++;
  });

  const accuracy = Math.round(ok / a.qs.length * 100);
  const secs = Math.round((Date.now() - a.t0) / 1000);

  if (!a.saved) {
    a.saved = true;
    S.results.push({
      tid: a.test ? a.test.id : Date.now(),
      email: user.email,
      name: user.name,
      course: a.test ? (a.test.course || 'DSA') : 'DSA',
      score,
      total,
      acc: accuracy,
      secs,
      topics: topicStats,
      ts: Date.now()
    });
    saveSystem();
  }

  const strengths = Object.entries(topicStats).filter(([, v]) => v[0] === v[1]).map(x => x[0]);
  const weaknesses = Object.entries(topicStats).filter(([, v]) => v[0] < v[1]).map(x => x[0]);

  $('#pg').innerHTML = `
    <div class="card" style="max-width:840px;margin:0 auto">
      <h2>Assessment Results</h2>
      <div class="grid" style="margin:16px 0">
        ${kpi('Total Score', score + ' / ' + total)}
        ${kpi('Accuracy', accuracy + '%')}
        ${kpi('Time Taken', Math.floor(secs / 60) + 'm ' + (secs % 60) + 's')}
        ${kpi('Questions Correct', ok + ' of ' + a.qs.length)}
      </div>

      <div class="card" style="margin:16px 0">
        <h3>Topic Breakdown</h3>
        ${Object.entries(topicStats).map(([tp, [c, tot]]) => `
          <div class="row" style="margin-top:6px">
            <span>${esc(tp)}</span>
            <b>${c} / ${tot} (${Math.round(c / tot * 100)}%)</b>
          </div>
          ${bar(c / tot * 100)}
        `).join('')}
        <p style="margin-top:12px">
          <b>Demonstrated Strengths:</b> ${strengths.join(', ') || 'Keep practicing'}<br>
          <b>Areas for Improvement:</b> ${weaknesses.join(', ') || 'No weak areas identified'}
        </p>
      </div>

      <button class="btn p" onclick="shell()">Return to Dashboard</button>
    </div>
  `;
}

const CERT_DOMAINS = {
  google: ['google.com', 'coursera.org', 'credential.net', 'grow.google'],
  microsoft: ['microsoft.com', 'credly.com'],
  aws: ['aws.amazon.com', 'amazon.com', 'credly.com'],
  coursera: ['coursera.org'],
  udemy: ['udemy.com'],
  nptel: ['nptel.ac.in', 'swayam.gov.in'],
  ibm: ['ibm.com', 'credly.com'],
  oracle: ['oracle.com', 'credly.com'],
  cisco: ['cisco.com', 'credly.com'],
  meta: ['coursera.org', 'meta.com'],
  hackerrank: ['hackerrank.com'],
  linkedin: ['linkedin.com']
};

function getMyCerts() {

function getMyProjects() {

const certBadge = s => {
  const cls = s === 'Verified' ? 'safe' : s === 'Pending Verification' ? 'pv' : s === 'Needs Review' ? 'def' : 'mut';
  return `<span class="st ${cls}">${esc(s)}</span>`;
};

function checkCertExpiry(c) {
  if (!c.expiry) return '';
  const diff = (new Date(c.expiry) - Date.now()) / 864e5;
  return diff < 0 ? 'Expired' : diff <= 60 ? 'Expiring Soon' : '';
}

function verifyCertificate(c) {
  const flags = [];
  const notes = [];
  let status = 'Pending Verification';

  if (c.issue && c.expiry && c.expiry < c.issue) {
    flags.push('Expiry date cannot precede issue date.');
  }

  // Check duplicate credential ID across platform
  const allCerts = Object.entries(S.certs || {}).flatMap(([e, l]) => l.map(x => ({ ...x, owner: e })));
  if (c.cid && allCerts.some(x => x.id !== c.id && x.cid && x.cid.toLowerCase() === c.cid.toLowerCase())) {
    flags.push('Duplicate credential ID detected in platform registry.');
  }

  // URL Domain verification
  if (c.url) {
    try {
      const u = new URL(c.url);
      if (u.protocol === 'https:') {
        const host = u.hostname.replace(/^www\./, '');
        const orgKey = Object.keys(CERT_DOMAINS).find(k => c.org.toLowerCase().includes(k));
        if (orgKey) {
          const match = CERT_DOMAINS[orgKey].some(d => host === d || host.endsWith('.' + d));
          if (match) {
            notes.push(`Credential URL matches certified authority domain (${host}).`);
            status = 'Verified';
          } else {
            flags.push(`Credential URL (${host}) does not match expected domain for ${c.org}.`);
            status = 'Needs Review';
          }
        } else {
          notes.push('Valid HTTPS credential URL provided; domain not in predefined registry.');
        }
      } else {
        flags.push('Credential URL must use secure HTTPS protocol.');
      }
    } catch (e) {
      flags.push('Invalid credential URL format.');
    }
  }

  // QR Code analysis
  if (c.qr) {
    notes.push('Digital QR code found and verified.');
    if (!flags.length) status = 'Verified';
  }

  if (flags.length) {
    status = 'Needs Review';
  } else if (!c.cid && !c.url && !c.qr) {
    status = 'Pending Verification';
    notes.push('Awaiting administrative verification.');
  }

  return { flags, notes, status };
}

// Read file as Data URL
function readFileAsDataURL(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

// QR Code scanning from image canvas using jsQR
function scanQRCodeFromImage(dataUrl) {
  return new Promise(resolve => {
    if (typeof jsQR === 'undefined') return resolve(null);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      const cvs = document.createElement('canvas');
      cvs.width = img.width * scale;
      cvs.height = img.height * scale;
      const ctx = cvs.getContext('2d');
      ctx.drawImage(img, 0, 0, cvs.width, cvs.height);
      const imgData = ctx.getImageData(0, 0, cvs.width, cvs.height);
      const qr = jsQR(imgData.data, imgData.width, imgData.height);
      resolve(qr ? qr.data : null);
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

        </div>

    };

  $$('[data-cdl]').forEach(b => {
    b.onclick = () => {
      const c = certs.find(x => x.id === +b.dataset.cdl);
      if (!c || !c.file) return;
      saveFile(c.file.name, dataURLtoBlob(c.file.data));
    };
  });

  $$('[data-cdel]').forEach(b => {
    b.onclick = () => {
      if (confirm('Delete this certification?')) {
        S.certs[user.email] = certs.filter(x => x.id !== +b.dataset.cdel);
        saveSystem();
        toast('Certification removed');
        renderRoute(roleNav[user.role], 'certifications');
      }
    };
  });

  $$('[data-cres]').forEach(b => {
    b.onclick = () => {
      const c = certs.find(x => x.id === +b.dataset.cres);
      const res = S.resume[user.email] = S.resume[user.email] || {};
      const line = `${c.name}, ${c.org} (${(c.issue || '').slice(0, 4)}) — Verified`;
      res.certs = res.certs ? `${res.certs}\n${line}` : line;
      saveSystem();
      toast('Added to your Resume Builder');
    };
  });

  // Review queue approvals (for faculty/admin)
  $$('[data-rqv]').forEach(b => {
    b.onclick = () => {
      const [email, id, status] = b.dataset.rqv.split('|');
      const targetCert = S.certs[email].find(c => c.id === +id);
      if (targetCert) {
        targetCert.status = status;
        targetCert.history.push({
          ts: Date.now(),
          evt: `Manual status update: ${status}`,
          src: `Reviewed by ${user.name} (${user.role})`
        });
        saveSystem();
        toast(`Certification marked as ${status}`);
        renderRoute(roleNav[user.role], 'certifications');
      }
    };
  });
};

function calculateATSScore(R) {
  const tips = [];
  let score = 0;

  // Summary evaluation
  if ((R.summary || '').length >= 120) {
    score += 15;
  } else {
    tips.push('Expand summary to 2-3 sentences (120+ characters) outlining career focus.');
  }

  // Skills count
  const skillCount = (R.skills || '').split(',').map(s => s.trim()).filter(Boolean).length;
  if (skillCount >= 6) {
    score += 15;
  } else {
    tips.push(`Add at least 6 relevant technical skills (currently ${skillCount}).`);
  }

  // Projects depth
  const projLines = (R.projects || '').split('\n').filter(s => s.trim()).length;
  if (projLines >= 2) {
    score += 15;
  } else {
    tips.push('Include at least 2 distinct technical projects.');
  }

  // Quantifiable metrics / numbers check
  const allText = [R.projects, R.experience, R.ach].join(' ');
  if (/\d+%|\d+\s*(users|students|stars|classes|marks|queries|ms)/i.test(allText) || /\d+/.test(allText)) {
    score += 15;
  } else {
    tips.push('Incorporate measurable metrics (percentages, numbers, results) in project/achievement descriptions.');
  }

  // Certifications
  const certLines = (R.certs || '').split('\n').filter(s => s.trim()).length;
  if (certLines >= 1) {
    score += 10;
  } else {
    tips.push('Include certified credentials to validate your technical expertise.');
  }

  // Education & grades
  if (R.education && R.cgpa) {
    score += 10;
  } else {
    tips.push('Ensure complete education background with CGPA is clearly provided.');
  }

  // Professional links
  if (R.github && R.linkedin) {
    score += 10;
  } else {
    tips.push('Include both LinkedIn and GitHub profile links.');
  }

  // Contact info
  if (R.email && R.phone && R.location) {
    score += 10;
  } else {
    tips.push('Provide complete contact information (email, phone, location).');
  }

  return { score: Math.min(100, score), tips };
}

// Generate ATS-Compliant Multi-Page PDF using jsPDF
function generateResumePDF(R) {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    toast('PDF generation library is still loading. Please try again.');
    return;
  }

  const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
  const W = 595.28;
  const margin = 46;
  const maxW = W - 2 * margin;
  let y = margin;

  const lines = str => (str || '').split('\n').map(s => s.trim()).filter(Boolean);
  const hide = R.hide || [];

  function checkPageBreak(neededHeight) {
    if (y + neededHeight > 780) {
      doc.addPage();
      y = margin;
    }
  }

  function addText(text, size = 10, isBold = false, align = 'left', lineGap = 13) {
    doc.setFont('helvetica', isBold ? 'bold' : 'normal');
    doc.setFontSize(size);
    const split = doc.splitTextToSize(String(text), maxW);
    split.forEach(line => {
      checkPageBreak(lineGap);
      if (align === 'center') {
        doc.text(line, W / 2, y, { align: 'center' });
      } else {
        doc.text(line, margin, y);
      }
      y += lineGap;
    });
  }

  function addSection(title, items, isBullet = false) {
    if (!items || !items.length) return;
    checkPageBreak(32);
    y += 6;
    addText(title, 11, true, 'left', 14);
    doc.setDrawColor(140);
    doc.setLineWidth(0.75);
    doc.line(margin, y - 10, W - margin, y - 10);

    items.forEach(item => {
      addText((isBullet ? '• ' : '') + item, 9.5, false, 'left', 13);
    });
  }

  // Header
  addText(R.name || 'Resume', 18, true, 'center', 22);
  const contact = [R.email, R.phone, R.location].filter(Boolean).join(' | ');
  if (contact) addText(contact, 9.5, false, 'center', 13);
  const links = [R.linkedin, R.github].filter(Boolean).join(' | ');
  if (links) addText(links, 9.5, false, 'center', 14);
  y += 4;

  if (!hide.includes('summary') && R.summary) {
    addSection('PROFESSIONAL SUMMARY', [R.summary]);
  }
  if (!hide.includes('education') && R.education) {
    const eduItems = [...lines(R.education)];
    if (R.cgpa || R.sgpa) {
      eduItems.push(`Cumulative CGPA: ${R.cgpa || '—'} / 10 ${R.sgpa ? ` | Current SGPA: ${R.sgpa}` : ''}`);
    }
    addSection('EDUCATION', eduItems, true);
  }
  if (!hide.includes('skills') && R.skills) {
    addSection('TECHNICAL SKILLS', [R.skills]);
  }
  if (!hide.includes('projects') && R.projects) {
    addSection('PROJECTS', lines(R.projects), true);
  }
  if (!hide.includes('experience') && R.experience) {
    addSection('EXPERIENCE', lines(R.experience), true);
  }
  if (!hide.includes('certs') && R.certs) {
    addSection('CERTIFICATIONS', lines(R.certs), true);
  }
  if (!hide.includes('ach') && R.ach) {
    addSection('ACHIEVEMENTS', lines(R.ach), true);
  }

  const safeFileName = (R.name || 'Resume').replace(/[^\w\-]+/g, '_') + '_CampusOne_Resume.pdf';
  saveFile(safeFileName, doc.output('blob'));
}

// Student Career Data Calculation
function careerData() {
  const projs = getMyProjects();
  const certs = getMyCerts();
  const gh = S.gh && S.gh[user.email];
  const ats = calculateATSScore(getResumeData()).score;
  const dsaAvg = Math.round(Object.values(D.topics).reduce((a, b) => a + b, 0) / Object.keys(D.topics).length);
  const verifiedCerts = certs.filter(c => c.status === 'Verified').length;

  const technical = Math.round((74 + 70 + 82 + 80) / 4);
  const projectsScore = Math.min(100, projs.length * 25);
  const certScore = Math.min(100, verifiedCerts * 35 + (certs.length - verifiedCerts) * 10);
  const ghScore = gh ? Math.min(100, gh.repos.length * 6 + Math.round((gh.total || 50) / 4)) : null;

  const breakdown = {
    Technical: technical,
    Projects: projectsScore,
    DSA: dsaAvg,
    GitHub: ghScore,
    Certifications: certScore,
    Resume: ats,
    Interview: 68
  };

  const validVals = Object.values(breakdown).filter(v => v != null);
  const overall = validVals.length ? Math.round(validVals.reduce((a, b) => a + b, 0) / validVals.length) : 70;
  return { overall, breakdown };
}

/* ================== STUDENT AI QUERY ENGINE ================== */
function studentAI(query) {
  const q = (' ' + query.toLowerCase().replace(/[?.,!]/g, ' ') + ' ').replace(/\s+/g, ' ');
  const a = attData();
  const loSubject = [...a.rows].sort((x, y) => x.p - y.p)[0];
  const wkTopics = Object.entries(D.topics).sort((x, y) => x[1] - y[1]);
  const ctx = contextState.s;

  // 1. Attendance queries
  if (/lowest.*attend|attend.*lowest/.test(q)) {
    ctx.lastIntent = 'att';
    return `${loSubject.k} is your lowest attendance subject at ${loSubject.p}% (${loSubject.def ? 'DEFAULTER' : 'SAFE'}).`;
  }
  if (/defaulter|below 75/.test(q)) {
    ctx.lastIntent = 'defaulter';
    if (a.def) {
      return `Yes, you are an OVERALL DEFAULTER with a cumulative attendance of ${a.p}%.`;
    }
    if (a.defs.length) {
      return `Your overall attendance is ${a.p}% (SAFE), but you are a DEFAULTER in: ${a.defs.map(r => `${r.k} (${r.p}%)`).join(', ')}. College guidelines require minimum 75% in every subject.`;
    }
    return `No, you are not a defaulter. Your overall attendance is ${a.p}%, and all individual courses are safely at or above 75%.`;
  }
  if (/attend/.test(q)) {
    ctx.lastIntent = 'att';
    const subMatch = SUBJ.find(s => q.includes(s.toLowerCase()));
    if (subMatch) {
      const row = a.rows.find(r => r.k.toLowerCase() === subMatch.toLowerCase());
      if (row) return `Your attendance in ${row.k} is ${row.p}% (${row.a} of ${row.t} classes attended). Status: ${row.def ? 'DEFAULTER' : 'SAFE'}.`;
    }
    return `Your cumulative attendance is ${a.p}% (${a.A} of ${a.T} classes attended). Overall Status: ${a.def ? 'OVERALL DEFAULTER' : 'SAFE'}. Lowest subject: ${loSubject.k} (${loSubject.p}%).`;
  }

  // 2. Academic Grades (SGPA / CGPA)
  if (/sgpa/.test(q)) {
    ctx.lastIntent = 'sgpa';
    return `Your latest Semester 6 SGPA is 8.42 / 10.`;
  }
  if (/cgpa|\bgpa\b/.test(q)) {
    ctx.lastIntent = 'cgpa';
    return `Your cumulative CGPA across all semesters is ${D.cgpa} / 10.`;
  }

  // 3. DSA Mastery & Topics
  if (/dsa|mastery/.test(q)) {
    ctx.lastIntent = 'dsa';
    return `Your verified DSA mastery is 68%, with curriculum completion at 74%. Your highest mastery is in Arrays (85%) and Strings (80%), while your weakest areas are Dynamic Programming (21%) and Graphs (34%).`;
  }

  // 4. Rankings
  if (/rank/.test(q)) {
    ctx.lastIntent = 'rank';
    return `Your current overall batch rank is ${D.rank}. In the DSA Competitive track, your rank is ${D.dsaRank} out of 72 students.`;
  }

  // 5. Recommendations: What should I improve / study today?
  if (/what should i study|study today/.test(q)) {
    ctx.lastIntent = 'study';
    return `Spend 45 minutes on Graphs (BFS & DFS) or Dynamic Programming (your lowest topic at 21% mastery), then attempt a 5-question sprint in the Assessments tab.`;
  }
  if (/improve|weak|weakest/.test(q)) {
    ctx.lastIntent = 'improve';
    const parts = [`Focus on algorithmic topics: ${wkTopics.slice(0, 2).map(x => `${x[0]} (${x[1]}%)`).join(' and ')}.`];
    if (a.defs.length) {
      parts.push(`Prioritize attending upcoming classes in ${a.defs.map(r => r.k).join(', ')} to clear your defaulter status.`);
    }
    return parts.join(' ');
  }

  // 6. Career Readiness & Resume
  if (/career|ready|readiness/.test(q)) {
    ctx.lastIntent = 'career';
    const c = careerData();
    return `Your overall career readiness score is ${c.overall}% based on verified evidence: Technical (${c.breakdown.Technical}%), Projects (${c.breakdown.Projects}%), DSA (${c.breakdown.DSA}%), Certifications (${c.breakdown.Certifications}%), Resume (${c.breakdown.Resume}%).`;
  }
  if (/resume|ats/.test(q)) {
    ctx.lastIntent = 'resume';
    const ats = calculateATSScore(getResumeData());
    return `Your current ATS resume score is ${ats.score}/100. Key suggestion: ${ats.tips[0] || 'Keep descriptions quantified and up to date.'}`;
  }

  // 7. Connected portfolio queries
  if (/project/.test(q)) {
    const projs = getMyProjects();
    return projs.length
      ? `You have ${projs.length} project(s) saved in your portfolio: ${projs.map(p => p.name).join(', ')}.`
      : `You have not saved any projects yet. Go to Projects to add one or import from GitHub.`;
  }
  if (/certif/.test(q)) {
    const certs = getMyCerts();
    const verified = certs.filter(c => c.status === 'Verified').length;
    return certs.length
      ? `You have ${certs.length} certification(s) logged: ${verified} verified, ${certs.length - verified} pending verification.`
      : `No certifications found. Upload your credentials under Certifications.`;
  }
  if (/github/.test(q)) {
    const gh = S.gh && S.gh[user.email];
    return gh
      ? `GitHub account @${gh.login} is connected with ${gh.repos.length} public repositories and ${gh.total || '120+'} contributions.`
      : `No GitHub account is currently connected. Go to GitHub to connect your profile.`;
  }

  // 8. Follow-up context handling
  if (/why|how|what about/.test(q) && ctx.lastIntent) {
    if (ctx.lastIntent === 'defaulter' || ctx.lastIntent === 'att') {
      return `Attendance rules require attending at least 75% of scheduled lectures. For ${loSubject.k}, you have attended ${loSubject.a} out of ${loSubject.t} classes (${loSubject.p}%). Attend upcoming lectures consecutively to restore safe standing.`;
    }
    if (ctx.lastIntent === 'dsa') {
      return `Your topic mastery is dynamically derived from your quiz and topic sprint scores in the Assessments section.`;
    }
  }

  return "I don't have that data available.";
}

   TEACHER AI — CAMPUSONE TEACHER AI (TEACHING & ACADEMIC ASSISTANT)

const TEACHER_GEN = {};
let tgenId = 0;

function teacherAI(query) {
  const q = (' ' + query.toLowerCase().replace(/[?.,!]/g, ' ') + ' ').replace(/\s+/g, ' ');
  const myCourses = mine();
  const stList = students();

  // Find requested course
  const courseMatch = myCourses.find(c => q.includes(c.toLowerCase()));
  // If teacher asked about course outside their authorization:
  const anyCourse = courses.find(c => q.includes(c.toLowerCase()));
  if (anyCourse && !myCourses.includes(anyCourse)) {
    return {
      text: `I can access only courses assigned to your faculty profile (${myCourses.join(', ') || 'None assigned'}). You are not authorized to view or manage data for ${anyCourse}.`
    };
  }

  const targetCourse = courseMatch || myCourses[0] || 'DSA';
  const myTests = S.tests.filter(t => t.teacher === user.email && (!courseMatch || t.course === courseMatch));
  const myTestIds = myTests.map(t => t.id);
  const myResults = S.results.filter(r => myTestIds.includes(r.tid));

  // 1. Question Generator (MCQs)
  // e.g. "Generate 10 medium-level DBMS MCQs on normalization."
  if (/generate|create|write|suggest/.test(q) && /question|mcq/.test(q)) {
    const numMatch = q.match(/\d+/);
    const count = Math.min(15, numMatch ? +numMatch[0] : 5);
    const diff = q.includes('hard') ? 'Hard' : q.includes('easy') ? 'Easy' : 'Medium';

    // Find topic
    const topicList = Object.keys(CAT[targetCourse] || {});
    const topicMatch = topicList.find(t => q.includes(t.toLowerCase())) || topicList[0] || 'Arrays';

    const generatedQs = [];
    for (let i = 0; i < count; i++) {
      const question = makeQ(targetCourse, topicMatch, diff, 'MCQ');
      question[8] = 2; // 2 marks
      generatedQs.push(question);
    }

    const draftId = 'tg_' + (tgenId++);
    TEACHER_GEN[draftId] = {
      id: draftId,
      kind: 'question',
      course: targetCourse,
      topic: topicMatch,
      title: `${count} ${diff} MCQs on ${topicMatch} (${targetCourse})`,
      qs: generatedQs,
      done: false
    };

    return {
      html: renderGeneratedQuestionsCard(draftId)
    };
  }

  // 2. Assessment Generator (Test proposal)
  // e.g. "Create a 20-mark DSA test on Trees and Graphs."
  if (/create|build|make|draft/.test(q) && /test|assessment|quiz/.test(q)) {
    const markMatch = q.match(/(\d+)\s*-?\s*mark/);
    const totalMarks = markMatch ? +markMatch[1] : 20;

    const topicList = Object.keys(CAT[targetCourse] || {});
    const requestedTopics = topicList.filter(t => q.includes(t.toLowerCase()));
    const topicsToUse = requestedTopics.length ? requestedTopics : topicList.slice(0, 3);

    const qCount = Math.max(4, Math.min(12, Math.round(totalMarks / 2)));
    const perMark = Math.max(1, Math.round(totalMarks / qCount));

    const testQuestions = [];
    for (let i = 0; i < qCount; i++) {
      const tp = topicsToUse[i % topicsToUse.length];
      const diff = i % 3 === 0 ? 'Easy' : i % 3 === 1 ? 'Medium' : 'Hard';
      const question = makeQ(targetCourse, tp, diff, 'MCQ');
      question[8] = perMark;
      testQuestions.push(question);
    }

    const draftId = 'tg_' + (tgenId++);
    TEACHER_GEN[draftId] = {
      id: draftId,
      kind: 'test',
      course: targetCourse,
      title: `${targetCourse} Assessment: ${topicsToUse.join(' & ')}`,
      time: Math.max(10, qCount * 2),
      totalMarks,
      qs: testQuestions,
      done: false
    };

    return {
      html: renderGeneratedTestCard(draftId)
    };
  }

  // 3. Class average performance / score
  if (/average performance|average score|class average|average marks/.test(q)) {
    if (!myResults.length) {
      return {
        text: `No students have attempted published assessments in your assigned courses (${myCourses.join(', ')}). Once students submit tests, class averages and performance analytics will appear here.`
      };
    }
    const avgScore = Math.round(myResults.reduce((a, b) => a + b.acc, 0) / myResults.length);
    return {
      text: `Across ${myResults.length} student assessment attempt(s) in your courses, the average performance is ${avgScore}%. Highest accuracy achieved is ${Math.max(...myResults.map(r => r.acc))}%.`
    };
  }

  // 4. Attendance & Defaulters query
  // e.g. "Which students are below 75% attendance?"
  if (/attendance|defaulter|below 75/.test(q)) {
    const defaulters = [];
    stList.forEach(s => {
      myCourses.forEach(c => {
        const row = attRow(s.id, c);
        if (isDefaulter(row)) {
          defaulters.push(`${s.name} (${c}: ${pc(row)}% — attended ${row[1]}/${row[0]} classes)`);
        }
      });
    });

    if (!defaulters.length) {
      return {
        text: `All students in your authorized courses (${myCourses.join(', ')}) are currently maintaining safe attendance at or above 75%.`
      };
    }
    return {
      text: `The following student(s) are below the mandatory 75% attendance threshold in your classes:\n• ` + defaulters.join('\n• ')
    };
  }

  // 5. Weakest topics in class
  if (/weakest topic|lowest.*performance|weak topics/.test(q)) {
    return {
      text: `Based on class assessment diagnostics for ${targetCourse}, the weakest topic areas are Dynamic Programming (21% accuracy) and Graphs BFS/DFS (34% accuracy). Arrays and SQL queries demonstrate the strongest class foundations.`
    };
  }

  // 6. Course Analysis Report
  // e.g. "How is my DBMS class performing?"
  if (/how is|class performing|report/.test(q)) {
    const courseResults = S.results.filter(r => r.course === targetCourse);
    const avgAcc = courseResults.length ? Math.round(courseResults.reduce((a, b) => a + b.acc, 0) / courseResults.length) : 74;
    const defCount = stList.filter(s => isDefaulter(attRow(s.id, targetCourse))).length;
    const asg = S.assigns.filter(a => a.course === targetCourse);
    const subCount = asg.reduce((s, a) => s + S.subs.filter(x => x.aid === a.id).length, 0);

    return {
      text: `Performance Analytics for ${targetCourse}:\n` +
        `• Class Assessment Average: ${avgAcc}%\n` +
        `• Attendance Average: 84% (${defCount} student(s) currently flagged as Defaulters)\n` +
        `• Assignment Completion Rate: ${asg.length ? Math.round(subCount / (asg.length * stList.length) * 100) : 85}%\n` +
        `• Strongest Topics: Normalization 2NF, Basic SQL Queries\n` +
        `• Weak Topics Requiring Review: BCNF Decomposition, Concurrency Locks`
    };
  }

  // 7. At-risk students
  // e.g. "Which students may need academic attention?"
  if (/attention|at.?risk|poorly|struggl/.test(q)) {
    const atRisk = [];
    stList.forEach(s => {
      const issues = [];
      myCourses.forEach(c => {
        const r = attRow(s.id, c);
        if (isDefaulter(r)) issues.push(`Attendance in ${c} is ${pc(r)}%`);
      });
      const sRes = S.results.filter(r => r.email === s.id);
      if (sRes.length && Math.round(sRes.reduce((a, b) => a + b.acc, 0) / sRes.length) < 55) {
        issues.push(`Assessment average is below 55%`);
      }
      if (issues.length) atRisk.push(`• ${s.name}: ${issues.join('; ')}`);
    });

    if (!atRisk.length) {
      return {
        text: `No students in your classes currently trigger at-risk criteria for attendance or assessment failure.`
      };
    }
    return {
      text: `These students may need academic attention based on attendance and assessment thresholds:\n` + atRisk.join('\n')
    };
  }

  // 8. Teaching recommendations for next week
  // e.g. "What should I focus on teaching next week?"
  if (/focus|next week|recommend|teaching/.test(q)) {
    return {
      text: `Suggested instructional priorities for next week in ${targetCourse}:\n` +
        `1. Revise BCNF and multi-valued dependencies through live classroom walkthroughs.\n` +
        `2. Follow up on students below 75% attendance to avoid examination disqualification.\n` +
        `3. Conduct a quick 10-minute formative quiz using the Question Generator to test concept retention.`
    };
  }

  return {
    text: `I don't have that specific data available. As CampusOne Teacher AI, I can help analyze class performance, identify defaulters, highlight at-risk students, generate MCQs, or draft multi-mark tests for your review and approval.`
  };
}

bindPage['Teacher AI'] = () => {
  const box = $('#t-chat-box');
  const inp = $('#t-chat-input');
  const btn = $('#t-chat-send');
  let busy = false;

  const scrollBottom = () => { if (box) box.scrollTop = box.scrollHeight; };
  const autoGrow = () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 130) + 'px';
  };
  scrollBottom();
  inp.oninput = autoGrow;

  const handleSend = (text) => {
    const q = (text || inp.value || '').trim();
    if (!q || busy) return;
    busy = true;
    btn.disabled = true;
    inp.value = '';
    autoGrow();

    // 1. Append user message
    const uMsg = { r: 'u', t: q, ts: Date.now() };
    const hist = getChatHistory('t');
    hist.push(uMsg);
    saveChatHistory('t', hist);
    box.insertAdjacentHTML('beforeend', renderChatMessage(uMsg));

    // 2. Animated typing indicator
    const typingId = 'ttpi_' + Date.now();
    box.insertAdjacentHTML('beforeend', `<div class="m b typing" id="${typingId}" aria-label="Typing"><i></i><i></i><i></i></div>`);
    scrollBottom();

    // 3. 2-second realistic delay before showing response
    setTimeout(() => {
      const typingEl = $(`#${typingId}`);
      if (typingEl) typingEl.remove();

      let ans;
      try { ans = teacherAI(q); } catch (e) { ans = { text: "I'm having trouble analyzing the academic data. Please try again." }; }

      const bMsg = {
        r: 'b',
        t: typeof ans === 'string' ? ans : (ans.text || ''),
        h: ans.html || null,
        ts: Date.now()
      };
      const curHist = getChatHistory('t');
      curHist.push(bMsg);
      saveChatHistory('t', curHist);

      box.insertAdjacentHTML('beforeend', renderChatMessage(bMsg));
      scrollBottom();
      busy = false;
      btn.disabled = false;
      inp.focus();
    }, 2000);
  };

  btn.onclick = () => handleSend();
  inp.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  };

  $$('[data-tsug]').forEach(b => {
    b.onclick = () => handleSend(b.dataset.tsug);
  });

  $('#t-chat-new').onclick = () => {
    saveChatHistory('t', []);
    contextState.t = { lastIntent: null, lastSubject: null };
    renderRoute(roleNav[user.role], 'teacher-ai');
    toast('New chat started');
  };

  $('#t-chat-clear').onclick = () => {
    saveChatHistory('t', []);
    contextState.t = { lastIntent: null, lastSubject: null };
    renderRoute(roleNav[user.role], 'teacher-ai');
    toast('Chat cleared');
  };

  setTimeout(() => inp.focus(), 60);
};

bindPage.Assignments = () => {

    if (!due) return $('#asg-err').textContent = 'Please specify a submission deadline.';

    if (editingAssignmentId) {
      const target = S.assigns.find(a => a.id === editingAssignmentId);
      if (target) Object.assign(target, { title, desc, course, marks, due });
    } else {
      S.assigns.unshift({
        id: Date.now(),
        teacher: user.email,
        title, desc, course, marks, due,
        ts: Date.now()
      });
    }

    editingAssignmentId = null;
    saveSystem();
    toast('Assignment saved successfully');
    renderRoute(roleNav[user.role], 'assignments');
  };

  const cancelBtn = $('#btn-cancel-asg');
  if (cancelBtn) cancelBtn.onclick = () => {
    editingAssignmentId = null;
    renderRoute(roleNav[user.role], 'assignments');
  };

  $$('[data-asg-edit]').forEach(b => {
    b.onclick = () => {
      editingAssignmentId = +b.dataset.asgEdit;
      renderRoute(roleNav[user.role], 'assignments');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  });

  $$('[data-asg-del]').forEach(b => {
    b.onclick = () => {
      if (confirm('Delete this assignment?')) {
        S.assigns = S.assigns.filter(a => a.id !== +b.dataset.asgDel);
        saveSystem();
        toast('Assignment deleted');
        renderRoute(roleNav[user.role], 'assignments');
      }
    };
  });

  $$('[data-asg-subs]').forEach(b => {
    b.onclick = () => {
      const aid = +b.dataset.asgSubs;
      const asg = S.assigns.find(a => a.id === aid);
      const st = students();
      const [ov] = modal(`
        <div class="row"><h2>Submissions: ${esc(asg.title)}</h2><button class="ib" data-x>✕</button></div>
        <p class="mut">Max Marks: ${asg.marks} · Deadline: ${esc(asg.due)}</p>
        <div class="tw" style="margin-top:12px">
          <table>
            <thead>
              <tr>
                <th>Student</th>
                <th>Status</th>
                <th>Date</th>
                <th>Score / ${asg.marks}</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${st.map(s => {
                const sub = S.subs.find(q => q.aid === aid && q.email === s.id);
                return `
                  <tr>
                    <td><b>${esc(s.name)}</b></td>
                    <td>${sub ? '<span class="st safe">Submitted</span>' : '<span class="st mut">Pending</span>'}</td>
                    <td>${sub ? esc(sub.date) : '—'}</td>
                    <td>
                      ${sub ? `<input type="number" min="0" max="${asg.marks}" value="${sub.score != null ? sub.score : ''}" placeholder="Score" style="width:75px" id="score_inp_${esc(s.id)}">` : '—'}
                    </td>
                    <td>
                      ${sub ? `<button class="btn p" style="padding:4px 10px;font-size:12px" data-save-score="${esc(s.id)}">Save</button>` : ''}
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `);

      ov.querySelectorAll('[data-save-score]').forEach(btn => {
        btn.onclick = () => {
          const sId = btn.dataset.saveScore;
          const sub = S.subs.find(q => q.aid === aid && q.email === sId);
          const inp = ov.querySelector(`#score_inp_${CSS.escape(sId)}`);
          if (sub && inp) {
            const val = inp.value;
            if (val === '') return toast('Enter a numeric score');
            sub.score = Math.min(asg.marks, Math.max(0, +val));
            saveSystem();
            toast('Score saved for student');
          }
        };
      });
    };
  });
};

      const time = +$('#ct-time').value || 10;

      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(u => {
              const isDeactivated = !!S.off[u.email];
              return `
                <tr>
                  <td><b>${esc(u.name)}</b></td>

/* ================== GLOBAL SEARCH & BRAND SPLASH ================== */
function openSearch() {
  const [ov, cl] = modal(`
    <div class="modal" style="max-width:460px">
      <input id="sq2" placeholder="Search pages, tools, sections..." autofocus>
      <div id="sr" style="margin-top:12px;max-height:280px;overflow-y:auto"></div>
    </div>
  `);
  const input = ov.querySelector('#sq2');
  const results = ov.querySelector('#sr');
  const allowed = [...roleNav[user.role], ...(user.role === 'student' ? more : []), 'Notifications', 'Profile'];

  const draw = () => {
    const q = input.value.toLowerCase().trim();
    const hits = allowed.filter(n => n.toLowerCase().includes(q));
    results.innerHTML = hits.map(n => `
      <a class="sl" href="#/${slug(n)}" data-x style="margin:4px 0">${n}</a>
    `).join('') || '<p class="mut">No matching sections found.</p>';
  };
  input.oninput = draw;
  draw();
}

function splash() {
  if (document.querySelector('.splash')) return;
  const s = document.createElement('div');
  s.className = 'splash';
  let html = '<i class="rg"></i><i class="rg" style="animation-delay:.5s"></i><i class="rg" style="animation-delay:1s"></i>';
  for (let i = 0; i < 20; i++) {
    const a = i / 20 * 6.283, d = 150 + Math.random() * 130;
    html += `<i class="pt" style="--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d}px;animation-delay:${i % 3 * 0.08}s"></i>`;
  }
  html += `
    <div class="sw">
      ${[...'CampusOne'].map((c, i) => `<span class="${i > 5 ? 'o' : ''}" style="--i:${i}">${c}</span>`).join('')}
    </div>
    <p class="stg">Your Campus. Your Progress. Your Future.</p>
  `;
  s.innerHTML = html;
  document.body.append(s);
  const closeSplash = () => {
    s.classList.add('out');
    setTimeout(() => s.remove(), 300);
  };
  s.onclick = closeSplash;
  setTimeout(closeSplash, 2800);
}

// Modal helper
function modal(contentHtml) {
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<div class="modal">${contentHtml}</div>`;
  document.body.append(ov);

  const close = () => {
    ov.classList.add('out');
    setTimeout(() => ov.remove(), 180);
  };

  ov.onclick = e => {
    if (e.target === ov || e.target.closest('[data-x]')) close();
  };
  return [ov, close];
}

// Hash change and initialization
window.addEventListener('hashchange', () => {
  document.querySelector('.menu')?.remove();
  if (user) shell();
  else login();
});

// Cursor glow for cards
document.addEventListener('pointermove', e => {
  const card = e.target.closest && e.target.closest('.card');
  if (card) {
    const rect = card.getBoundingClientRect();
    card.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
    card.style.setProperty('--my', (e.clientY - rect.top) + 'px');
  }
});

// Initial boot
user ? shell() : login();
